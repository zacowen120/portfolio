<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zac Owen, Portfolio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23131009%22/><text x=%2250%22 y=%2274%22 font-family=%22Georgia,'Newsreader',serif%22 font-size=%2270%22 font-weight=%22600%22 fill=%22%23f1e9db%22 text-anchor=%22middle%22>Z</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#131009;--cream:#f1e9db;--muted:#9a9082;--accent:#c9a25e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:'Hanken Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:clamp(1.5rem,5vw,3.5rem);-webkit-font-smoothing:antialiased;}
  .top{display:flex;align-items:center;gap:.6rem;font-family:'Newsreader',Georgia,serif;font-size:1.05rem;letter-spacing:.02em;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,94,.5);}70%{box-shadow:0 0 0 10px rgba(201,162,94,0);}100%{box-shadow:0 0 0 0 rgba(201,162,94,0);}}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:46rem;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,8vw,5rem);line-height:1.04;letter-spacing:-.01em;}
  h1 em{font-style:italic;color:var(--accent);}
  .sub{margin-top:1.6rem;color:var(--muted);font-size:clamp(1rem,2.2vw,1.2rem);line-height:1.55;max-width:34rem;}
  .foot{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:center;margin-top:2.5rem;font-size:.98rem;}
  a{color:var(--cream);text-decoration:none;border-bottom:1px solid rgba(241,233,219,.3);padding-bottom:2px;transition:border-color .25s,color .25s;}
  a:hover{color:var(--accent);border-color:var(--accent);}
  .sep{color:rgba(241,233,219,.25);}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.center{animation:none;}.dot{animation:none;}}
</style>
</head>
<body>
  <div class="top"><span class="dot"></span>&nbsp;Zac Owen</div>
  <main class="center">
    <h1>Currently refining the <em>details</em>.</h1>
    <p class="sub">My portfolio is being updated and will be ready for your viewing pleasure soon. Thanks for stopping by early.</p>
    <div class="foot">
      <a href="https://www.linkedin.com/in/zac-owen/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </main>
</body>
</html>
